name: test

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: install parser
        run: pip install pyyaml
      - name: contract tests
        run: python -m unittest discover -s tests -v
      - name: our own workflow must be lean
        run: python scripts/cigate . --strict --no-color
      - name: the red example must be caught
        run: |
          python scripts/cigate examples/mini-repo --runs-json examples/runs.json --max-waste-minutes 5 --no-color || test $? -eq 1
